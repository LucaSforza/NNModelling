[project]
name = "mnist-fds"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.1.0",         # Abbassato per consentire la 2.6.0+cu124
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pytest>=9.0.0",
  "uvicorn[standard]>=0.30.0",
  "valkey>=6.0.0",
  "safetensors>=0.7.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[tool.pytest.ini_options]
testpaths = ["src/tests"]
markers = [
    "fast: quick unit and integration tests without real services or training",
    "service: integration tests against real infrastructure (Valkey)",
    "e2e: canonical full-path backend job tests on deterministic datasets (real API, store, scheduler, executor)",
]
addopts = "-m \"not service and not e2e\""
