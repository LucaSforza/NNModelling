[project]
name = "mnist-fds"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "hydra-core>=1.3.2",
  "lightning>=2.6.1",
  "torch>=2.1.0",         # Abbassato per consentire la 2.6.0+cu124
  "torchvision>=0.16.0",  # Abbassato per consentire la 0.21.0+cu124
  "wandb>=0.24.2",
  "transformers>=4.30.0",
  "datasets>=2.14.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pytest>=9.0.0",
  "uvicorn[standard]>=0.30.0",
  "valkey>=6.0.0",
  "safetensors>=0.7.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
markers = [
    "fast: quick unit and integration tests without real services or training",
    "service: integration tests against real infrastructure (Valkey)",
    "e2e: canonical full-path backend job tests on deterministic datasets (real API, store, scheduler, executor)",
    "legacy_e2e: legacy one-epoch MNIST training/inference smoke tests that download real MNIST",
]
addopts = "-m \"not service and not e2e and not legacy_e2e\""
