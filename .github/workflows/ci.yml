name: CI

on:
  push:
    branches: [master, typeSystem, milestone-a-testing-foundation]
  pull_request:
    branches: [master, typeSystem]

# Serialize runs on the same ref so a superseded push cancels its in-flight
# integration work instead of stacking multiple expensive runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend CI (check · unit · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Checkout pinned type-system oracle
        uses: actions/checkout@v4
        with:
          repository: LucaSforza/stereotype-lab
          ref: ef3efb1859b4a9c19227dd55aade65767fd4b1f5
          path: .cache/stereotype-lab
      - run: pnpm install
      - run: pnpm --filter @nnmodelling/front-end run check
      - run: pnpm --filter @nnmodelling/front-end run test
      - run: pnpm --filter @nnmodelling/front-end run build

  frontend-integration:
    name: Frontend package conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Checkout pinned type-system oracle
        uses: actions/checkout@v4
        with:
          repository: LucaSforza/stereotype-lab
          ref: ef3efb1859b4a9c19227dd55aade65767fd4b1f5
          path: .cache/stereotype-lab
      - run: pnpm install
      - run: pnpm --filter @nnmodelling/front-end run test:type-system
      - run: pnpm --filter @nnmodelling/front-end run test:type-system:models

  backend-fast:
    name: Backend fast gate (-m fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('converted/uv.lock') }}
      - run: uv sync
        working-directory: converted
      # Explicit positive selection: the `fast` marker is auto-applied by
      # conftest.py to every test without an explicit gate marker, so this
      # never picks up the network-dependent legacy_e2e suite (real MNIST
      # downloads) that a negative selector like "not service and not e2e"
      # would now include.
      - run: uv run pytest src/tests/ -m fast -q
        working-directory: converted

  # Milestone A T3: real Valkey service. NNM_REQUIRE_VALKEY=1 turns a missing
  # service into a test failure, so absence is never a silent skip.
  backend-service:
    name: Backend service gate (real Valkey)
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NNM_REQUIRE_VALKEY: "1"
      NNM_VALKEY_URL: valkey://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('converted/uv.lock') }}
      - run: uv sync
        working-directory: converted
      - run: uv run pytest src/tests/ -m service -q
        working-directory: converted

  mcp-ci:
    name: MCP Server CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @nnmodelling/mcp-server run build
      - run: pnpm --filter @nnmodelling/mcp-server run test

  flatpak-ci:
    name: Flatpak build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Electron host
        run: pnpm --dir desktop test
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder xauth xvfb
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build and install Flatpak
        run: |
          flatpak-builder --force-clean --user \
            --install-deps-from=flathub \
            --repo=repo --install builddir \
            io.github.LucaSforza.NNModelling.yml
      - name: Validate installed Flatpak
        run: |
          flatpak info --user io.github.LucaSforza.NNModelling
          test -x "$(flatpak info --user --show-location \
            io.github.LucaSforza.NNModelling)/files/bin/run.sh"
      - name: Smoke test Flatpak launch
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 20s \
            xvfb-run -a -s "-screen 0 1280x1024x24" \
            flatpak run --user io.github.LucaSforza.NNModelling --disable-gpu
          status=$?
          if [ "$status" -ne 124 ]; then
            echo "Flatpak exited before the smoke-test timeout (status $status)"
            exit "$status"
          fi
      - name: Build Flatpak bundle
        run: |
          flatpak build-bundle repo NNModelling.flatpak \
            io.github.LucaSforza.NNModelling \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@v4
        with:
          name: nnmodelling-flatpak
          path: NNModelling.flatpak
