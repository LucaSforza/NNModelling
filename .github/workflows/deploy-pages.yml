name: Deploy installation page to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The editor is served locally by the companion, never from Pages.
      # Only the installation page (with the one start command) is published;
      # front-end/dist is intentionally never uploaded.
      - name: Upload installation site
        uses: actions/upload-pages-artifact@v3
        with:
          path: install

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
