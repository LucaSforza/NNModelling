[project]
name = "nnm-vae-mnist-example"
version = "0.1.0"
description = "Standalone consumer for an NNModelling VAE wheel"
requires-python = ">=3.12"
dependencies = [
  "nnm-vae-export",
  "Pillow>=10",
  "torch>=2.0",
  "torchvision>=0.15",
]

[tool.uv]
package = false

[tool.uv.sources]
nnm-vae-export = { path = "nnm_vae_export-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8"]
