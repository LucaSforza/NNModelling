[project]
name = "spamham-classifier"
version = "0.1.0"
description = "Minimal consumer for the generated NNModelling spam/ham wheel"
requires-python = ">=3.12"
dependencies = ["nnm-spamham", "numpy", "torch"]

[project.scripts]
spamham-classify = "spamham_classifier:main"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
nnm-spamham = { path = "nnm_spamham-0.1.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spamham_classifier.py", "src/package_runtime", "src/stereotype_runtime"]
