[project]
name = "resnet-mnist-example"
version = "0.1.0"
description = "Standalone NNModelling ResNet MNIST consumer example"
requires-python = ">=3.12"
dependencies = [
    "nnm-resnet-mnist",
    "pillow>=12.0",
    "torchvision>=0.28",
]

[tool.uv]
package = false

[tool.uv.sources]
nnm-resnet-mnist = { path = "nnm_resnet_mnist-0.1.0-py3-none-any.whl" }
